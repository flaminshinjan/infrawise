app = "shared-device-lab-tunnel"
primary_region = "sin"

# Chisel reverse tunnel: the machine running the emulators dials OUT to this
# app (scripts/attach-devices-to-cloud.sh) and reverse-forwards each device's
# ADB TCP port. The API app then reaches devices at
# shared-device-lab-tunnel.internal:1555x over Fly private networking.

[build]
  image = "jpillora/chisel:1.10.1"

[processes]
  app = "server --reverse --port 8080"

# auth: chisel reads credentials from the AUTH secret (user:pass)

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
