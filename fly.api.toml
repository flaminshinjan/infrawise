app = "shared-device-lab-api"
primary_region = "sin"

[build]
  dockerfile = "deploy/api.Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "4000"
  CORS_ORIGINS = "https://shared-device-lab-web.fly.dev"
  # Devices reach the cloud through the chisel reverse tunnel
  # (scripts/attach-devices-to-cloud.sh); serial == adb TCP target.
  DEVICE_SERIALS = "shared-device-lab-tunnel.internal:15554,shared-device-lab-tunnel.internal:15556,shared-device-lab-tunnel.internal:15558"
  ADB_CONNECT = "shared-device-lab-tunnel.internal:15554,shared-device-lab-tunnel.internal:15556,shared-device-lab-tunnel.internal:15558"
  STREAM_MODE = "auto"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 4000
  force_https = true
  # The reaper/allocator must keep running; never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/v1/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
