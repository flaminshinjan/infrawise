app = "shared-device-lab-web"
primary_region = "sin"

[build]
  dockerfile = "deploy/web.Dockerfile"

  [build.args]
    VITE_API_ORIGIN = "https://shared-device-lab-api.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
